[workspace]
resolver = "3"
members = ["crates/*"]
# The upstream checkouts are workspaces of their own.
exclude = ["upstream"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
concurro-relay-protocol = { path = "crates/protocol" }
concurro-relay = { path = "crates/relay" }
concurro-relay-verifier = { path = "crates/verifier" }

# Prepared by scripts/upstream.sh.
tlsn = { path = "upstream/tlsn/crates/tlsn", features = ["mozilla-certs"] }
tlsn-server-fixture-certs = { path = "upstream/tlsn/crates/server-fixture/certs" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mimalloc = "0.1"
ratatui = "0.29"
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["compat"] }
webpki-roots = "1"
zstd = "0.13"

# Proofs are too slow to develop against without optimization.
[profile.dev]
opt-level = 3

# The patched mpz and rangeset which the patched tlsn is built against.
[patch."https://github.com/tlsnotary/mpz2"]
clmul = { path = "upstream/mpz2/crates/clmul" }
matrix-transpose = { path = "upstream/mpz2/crates/matrix-transpose" }
mpz-circuits = { path = "upstream/mpz2/crates/circuits" }
mpz-circuits-core = { path = "upstream/mpz2/crates/circuits-core" }
mpz-circuits-data = { path = "upstream/mpz2/crates/circuits-data" }
mpz-cointoss-core = { path = "upstream/mpz2/crates/cointoss-core" }
mpz-common = { path = "upstream/mpz2/crates/common" }
mpz-core = { path = "upstream/mpz2/crates/core" }
mpz-fields = { path = "upstream/mpz2/crates/fields" }
mpz-garble = { path = "upstream/mpz2/crates/garble" }
mpz-garble-core = { path = "upstream/mpz2/crates/garble-core" }
mpz-hash = { path = "upstream/mpz2/crates/hash" }
mpz-ideal-vm = { path = "upstream/mpz2/crates/ideal-vm" }
mpz-memory-core = { path = "upstream/mpz2/crates/memory-core" }
mpz-ole = { path = "upstream/mpz2/crates/ole" }
mpz-ole-core = { path = "upstream/mpz2/crates/ole-core" }
mpz-ot = { path = "upstream/mpz2/crates/ot" }
mpz-ot-core = { path = "upstream/mpz2/crates/ot-core" }
mpz-share-conversion = { path = "upstream/mpz2/crates/share-conversion" }
mpz-share-conversion-core = { path = "upstream/mpz2/crates/share-conversion-core" }
mpz-vm-core = { path = "upstream/mpz2/crates/vm-core" }
mpz-zk = { path = "upstream/mpz2/crates/zk" }
mpz-zk-core = { path = "upstream/mpz2/crates/zk-core" }

[patch.crates-io]
rangeset = { path = "upstream/rangeset" }
