[workspace]
resolver = "3"
members = ["crates/*"]
# The upstream checkouts are workspaces of their own.
exclude = ["upstream"]

[workspace.package]
version = "0.1.1"
edition = "2024"
publish = false

[workspace.dependencies]
concurro-relay-hosted-api = { path = "crates/hosted-api" }
concurro-relay-protocol = { path = "crates/protocol" }
concurro-relay = { path = "crates/relay" }
concurro-relay-verifier = { path = "crates/verifier" }
concurro-relay-native = { path = "crates/native" }
concurro-relay-native-transport = { path = "crates/native-transport" }
concurro-relay-provider-protocol = { path = "crates/provider-protocol" }
concurro-relay-tls13 = { path = "crates/tls13" }

# Prepared by scripts/upstream.sh.
tlsn = { path = "upstream/tlsn/crates/tlsn", features = ["mozilla-certs"] }
tlsn-server-fixture-certs = { path = "upstream/tlsn/crates/server-fixture/certs" }

anyhow = { version = "=1.0.104", default-features = false, features = ["std"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
clap = { version = "=4.6.7", default-features = false, features = ["color", "derive", "env", "error-context", "help", "std", "suggestions", "usage"] }
dirs = { version = "=6.0.0", default-features = false }
futures = { version = "=0.3.34", default-features = false, features = ["async-await", "executor", "std"] }
hex = { version = "=0.4.3", default-features = false, features = ["std"] }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
httlib-hpack = { version = "=0.1.3", default-features = false }
libc = { version = "=0.2.191", default-features = false, features = ["std"] }
mimalloc = { version = "=0.1.52", default-features = false }
num-bigint = { version = "=0.4.8", default-features = false, features = ["std"] }
percent-encoding = { version = "=2.3.2", default-features = false, features = ["alloc"] }
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic", "ecdsa", "pem", "std"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm", "underline-color"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "pem", "ring"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc", "dev_urandom_fallback"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pemfile = { version = "=2.2.0", default-features = false, features = ["std"] }
rustls-webpki = { version = "=0.103.17", default-features = false, features = ["alloc", "ring", "std"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
socket2 = { version = "=0.6.5", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
time = { version = "=0.3.55", default-features = false, features = ["serde-well-known"] }
tokio = { version = "=1.54.1", default-features = false, features = ["full"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["handshake"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["compat"] }
webpki-roots = { version = "=1.0.12", default-features = false }
zstd = { version = "=0.13.5", default-features = false, features = ["arrays", "legacy", "zdict_builder"] }

# Proofs are too slow to develop against without optimization.
[profile.dev]
opt-level = 3

# The patched mpz and rangeset which the patched tlsn is built against.
[patch."https://github.com/tlsnotary/mpz2"]
clmul = { path = "upstream/mpz2/crates/clmul" }
matrix-transpose = { path = "upstream/mpz2/crates/matrix-transpose" }
mpz-circuits = { path = "upstream/mpz2/crates/circuits" }
mpz-circuits-core = { path = "upstream/mpz2/crates/circuits-core" }
mpz-circuits-data = { path = "upstream/mpz2/crates/circuits-data" }
mpz-cointoss-core = { path = "upstream/mpz2/crates/cointoss-core" }
mpz-common = { path = "upstream/mpz2/crates/common" }
mpz-core = { path = "upstream/mpz2/crates/core" }
mpz-fields = { path = "upstream/mpz2/crates/fields" }
mpz-garble = { path = "upstream/mpz2/crates/garble" }
mpz-garble-core = { path = "upstream/mpz2/crates/garble-core" }
mpz-hash = { path = "upstream/mpz2/crates/hash" }
mpz-ideal-vm = { path = "upstream/mpz2/crates/ideal-vm" }
mpz-memory-core = { path = "upstream/mpz2/crates/memory-core" }
mpz-ole = { path = "upstream/mpz2/crates/ole" }
mpz-ole-core = { path = "upstream/mpz2/crates/ole-core" }
mpz-ot = { path = "upstream/mpz2/crates/ot" }
mpz-ot-core = { path = "upstream/mpz2/crates/ot-core" }
mpz-share-conversion = { path = "upstream/mpz2/crates/share-conversion" }
mpz-share-conversion-core = { path = "upstream/mpz2/crates/share-conversion-core" }
mpz-vm-core = { path = "upstream/mpz2/crates/vm-core" }
mpz-zk = { path = "upstream/mpz2/crates/zk" }
mpz-zk-core = { path = "upstream/mpz2/crates/zk-core" }

[patch.crates-io]
rangeset = { path = "upstream/rangeset" }
