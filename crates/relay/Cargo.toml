[package]
name = "concurro-relay"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Keeps a sponsor's provider login on their machine and performs the requests Concurro orders with it"
repository = "https://github.com/concurro/concurro-relay"

# The one distributed package; see dist-workspace.toml.
[package.metadata.dist]
dist = true

[dependencies]
concurro-relay-protocol.workspace = true
concurro-relay-native.workspace = true
tlsn.workspace = true

anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dirs.workspace = true
futures.workspace = true
mimalloc.workspace = true
ratatui.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
